workflows:

  savify-android:
    name: Savify Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: 22.11.0

      vars:
        PACKAGE_NAME: com.savify.mobile

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Expo Doctor
        script: npx expo-doctor

      - name: Generate Android project
        script: npx expo prebuild --platform android --non-interactive

      - name: Configure Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build APK
        script: |
          cd android
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/build/outputs/**/*.log


  savify-android-production:
    name: Savify Android Production AAB
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: 22.11.0

      vars:
        PACKAGE_NAME: com.savify.mobile

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Generate Android project
        script: npx expo prebuild --platform android --non-interactive

      - name: Configure Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build Android App Bundle
        script: |
          cd android
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/**/*.aab


  savify-ios:
    name: Savify iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: 22.11.0
      xcode: latest
      cocoapods: default

      vars:
        BUNDLE_ID: com.savify.mobile

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Generate iOS project
        script: npx expo prebuild --platform ios --non-interactive

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Build iOS application
        script: |
          xcodebuild \
            -workspace ios/Savify.xcworkspace \
            -scheme Savify \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/ios/Build/Products/Release-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
